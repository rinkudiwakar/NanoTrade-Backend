[pytest]
asyncio_mode = auto
testpaths = ../tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*



# Only collect unit tests in CI — integration/load tests are excluded
# by being placed in tests/integration/ or marked with @pytest.mark.integration
addopts =
    -v
    --tb=short
    --strict-markers

markers =
    integration: mark test as requiring live Supabase + Redis (skipped in CI)
    load: mark test as a load / stress test (never run in CI)
    load: mark test as load test
